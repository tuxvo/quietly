<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Quietly</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="9" fill="#14171d"/>
        <circle cx="16" cy="16" r="7" fill="none" stroke="#7ad9c3" stroke-width="2"/>
        <circle cx="16" cy="16" r="2" fill="#7ad9c3"/>
      </svg>
      <span id="brand-name">Quietly</span>
      <span class="chip" title="Nothing on this site is shared or cached">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3"/><path d="M5 11h14v9H5z"/></svg>
        Private
      </span>
    </div>
    <div class="top-right">
      <span id="save-status" class="status" role="status" aria-live="polite"></span>
      <button id="quick-exit" class="btn exit" type="button" title="Leaves this site immediately. Keyboard: press Esc three times.">
        Quick exit <kbd>Esc ×3</kbd>
      </button>
    </div>
  </header>

  <nav id="nav" class="nav" aria-label="Sections" hidden></nav>

  <main id="view" tabindex="-1">
    <noscript><p class="notice">This guide needs JavaScript to run. Nothing is loaded from other websites.</p></noscript>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
